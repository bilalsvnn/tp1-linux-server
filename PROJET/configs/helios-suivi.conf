# Sondes du portail de suivi Helios
# Code HTTP de etat.json (attendu : 200)
UserParameter=helios.suivi.http,curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/etat.json
# Age de etat.json en secondes (attendu : < 300)
UserParameter=helios.suivi.age,echo $(( $(date +%s) - $(stat -c %Y /srv/helios/suivi/www/etat.json) ))
